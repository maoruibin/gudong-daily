name: Daily Content Update

on:
  schedule:
    # 每天上午 8:30 运行 (UTC+8)
    - cron: '30 0 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update content
      run: |
        echo "Running content update..."
        # 这里可以添加数据抓取脚本
        node scripts/update-content.js || true
        
    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update daily content [$(date +%Y-%m-%d)]" && git push)
