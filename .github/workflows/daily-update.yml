name: Daily Content Update

on:
  schedule:
    # 每 2 小时运行一次 (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  update-nba:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Update NBA data
      run: node scripts/update-nba.js
      
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet data/nba.json; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "✅ NBA 数据无变化"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "🔄 NBA 数据有更新"
        fi
        
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/nba.json
        git commit -m "chore: auto-update NBA data [$(date +%Y-%m-%d %H:%M)]"
        git push
        
    - name: Trigger Vercel Deploy
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        echo "🚀 数据已更新，Vercel 将自动部署"
